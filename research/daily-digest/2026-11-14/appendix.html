## 4. 跨学科机制完整映射与创新假说 (IDEA-009)

依据运行手册第 9 节规定，固定六步严格论述：

1. **融合中的失效现象**：  
   在车载、无人机等非严格配准 IVIF 场景中，即便采用全局主平面单应性对齐，地面上的三维立体目标（如站立行人、行进车辆、路灯立杆）与背景地面之间仍然存在垂直方向的巨大真实视差（Parallax）。由于当前深度形变场普遍采用连续性平滑先验（如全变分正则或 $L_2$ 梯度惩罚 $\|\nabla \mathbf{u}\|^2$），强行假设整个画面的位移是空间连续函数，导致在 3D 目标轮廓交界线上发生非物理的“橡胶薄膜牵拉现象”——前景目标的边界被强行拉扯变形，周围背景像素被挤压扭曲，在融合图像中形成严重的锯齿拉丝、目标边缘虚焦以及轮廓外侧光晕伪影。

2. **外部学科机制原貌（断裂力学与复合材料力学 / 内聚力模型 Cohesive Zone Model, CZM）**：  
   在固体力学中，层状复合材料或开裂基体承受大剪切载荷时，材料内部遵循连续弹性变形，但在层间界面或裂纹扩展前缘会产生微观脱粘与滑移。经典的 **Barenblatt-Dugdale 内聚力模型** 将整个位移场解耦为内部连续变形与界面处的有限位移跃变（Displacement Jump）：
   $$\mathbf{u}(\mathbf{x}) = \mathbf{u}_{\text{continuous}}(\mathbf{x}) + H(\mathbf{x} \in \Omega_{\text{fg}}) \cdot [\![ \mathbf{u} ]\!](\mathbf{x})$$
   界面两端承受的法向与剪切牵引力 $\mathbf{T}$ 与跃变量 $[\![ \mathbf{u} ]\!]$ 遵循**内聚牵引力-分离定律（Traction-Separation Law）**。当剪切应变超过临界软化阈值时，界面允许产生有限的不连续位移释放集中应力，从而避免基底发生非物理的极端畸变断裂。

3. **机制抽象与映射**：  
   - 连续弹性介质基底 $\longleftrightarrow$ 大尺度主平面背景（地面、墙面）；
   - 界面缺陷与剪切应力集中带 $\longleftrightarrow$ 3D 立体目标（行人、车辆）与主平面背景的深度分界轮廓线 $\Gamma_{\text{edge}}$；
   - 界面内聚位移跃变 $[\![ \mathbf{u} ]\!]$ $\longleftrightarrow$ 前景目标相对背景主平面的残余视差跃变（Disparity Jump）；
   - 内聚自由能耗散软化 $\longleftrightarrow$ 允许变形场在语义深度边界处打破连续平滑惩罚，以有边界的牵引力罚项吸收几何视差跳变。

4. **融合领域查重**：  
   - 检索表达式：`(&quot;cohesive zone&quot; OR &quot;displacement jump&quot; OR &quot;traction separation&quot;) AND (&quot;infrared&quot; OR &quot;visible&quot;) AND (&quot;fusion&quot; OR &quot;registration&quot;)` 在 IEEE Xplore、Crossref 与 Google Scholar 全库检索。
   - 检索结果：0 篇命中。现有非配准融合（如 URMIF、RFN-Nest、RFNet）均沿用传统光流的连续平滑假设或局部可形变卷积，尚无引入固体力学内聚界面位移跃变算子的先例，属力学机理跨界首创。

5. **创新假说与最小验证（MVP）**：  
   - **创新假说**：在双分支通用解耦框架中，若将稠密变形场参数化为“主平面连续形变基底 + 语义边界内聚位移跃变场”，并以可微分内聚势能损失替代深度边缘的 $L_2$ 平滑惩罚，则能消除目标边缘的橡胶拉扯伪影，使 3D 前景边缘清晰度与对齐精度同步提升。
   - **数据与对照组**：选用 RIVIR 数据集中具有典型近景行人大视差的 40 对图像；基线组为 URMIF 官方标准连续形变场，实验组在检测/分割掩码边缘挂载内聚位移跃变算子。
   - **成功判据**：目标边界法向梯度过渡宽度缩窄 30% 以上，局部边缘重影伪影指标 $N_{abf}$ 降低 25% 以上，且主平面背景平滑性不受破坏。
   - **失败判据**：内聚跃变导致前景目标整体漂移脱节，或在无视差平坦区域发生误判跃变。

6. **证据等级**：［合理推测 / 待实验验证］。

## 5. 工具资讯核验明细：RoMa v2

- **登记编号**：[TOOL-010]
- **项目全称**：RoMa v2: Harder Better Faster Denser Feature Matching
- **官方开源代码**：[Parskatt/RoMaV2 (GitHub)](https://github.com/Parskatt/RoMaV2) ｜ 论文链接：[arXiv:2406.18520](https://arxiv.org/abs/2406.18520) (CVPR 2024 / TPAMI 2025)
- **技术定位**：结合视觉基础模型（DINOv2/DINOv3）与多尺度局部金字塔的稠密特征匹配与变形场估计引擎。
- **与已有工具对比的增量**：
  - 相比 SuperPoint + SuperGlue / LightGlue：后者仅能在角点处提取离散稀疏点对，在光滑路面、暗光无纹理区极易失效；
  - RoMa v2 直接对整幅图像进行稠密特征回归，输出全分辨率的逐像素变换向量场 $\mathbf{W}(x, y)$ 与匹配可信度掩码 $C(x, y)$，与 URMIF 的分层变形估计具有天然互补性。
- **环境兼容性**：Python 3.10+, PyTorch 2.0+, 支持 CUDA FP16 推理；单卡 A4000 (16GB) 可在 60ms 内完成 $640 \times 480$ 图像对匹配。

罚，则能消除目标边缘的橡胶拉扯伪影，使 3D 前景边缘清晰度与对齐精度同步提升。\n   - **数据与对照组**：选用 RIVIR 数据集中具有典型近景行人大视差的 40 对图像；基线组为 URMIF 官方标准连续形变场，实验组在检测/分割掩码边缘挂载内聚位移跃变算子。\n   - **成功判据**：目标边界法向梯度过渡宽度缩窄 30% 以上，局部边缘重影伪影指标 $N_{abf}$ 降低 25% 以上，且主平面背景平滑性不受破坏。\n   - **失败判据**：内聚跃变导致前景目标整体漂移脱节，或在无视差平坦区域发生误判跃变。\n\n6. **证据等级**：［合理推测 / 待实验验证］。\n\n---\n\n## 5. 工具资讯核验明细：RoMa v2\n\n- **登记编号**：[TOOL-010]\n- **项目全称**：RoMa v2: Harder Better Faster Denser Feature Matching\n- **官方开源代码**：[Parskatt/RoMaV2 (GitHub)](https://github.com/Parskatt/RoMaV2) ｜ 论文链接：[arXiv:2406.18520](https://arxiv.org/abs/2406.18520) (CVPR 2024 / TPAMI 2025)\n- **技术定位**：结合视觉基础模型（DINOv2/DINOv3）与多尺度局部金字塔的稠密特征匹配与变形场估计引擎。\n- **与已有工具对比的增量**：\n  - 相比 SuperPoint + SuperGlue / LightGlue：后者仅能在角点处提取离散稀疏点对，在光滑路面、暗光无纹理区极易失效；\n  - RoMa v2 直接对整幅图像进行稠密特征回归，输出全分辨率的逐像素变换向量场 $\\mathbf{W}(x, y)$ 与匹配可信度掩码 $C(x, y)$，与 URMIF 的分层变形估计具有天然互补性。\n- **环境兼容性**：Python 3.10+, PyTorch 2.0+, 支持 CUDA FP16 推理；单卡 A4000 (16GB) 可在 60ms 内完成 $640 \\times 480$ 图像对匹配。\n\n---\n\n## 6. 运行环境与审计记录\n\n- **执行日期**：2026-11-14\n- **运行模式**：Orca 每日定时研报任务（v6 架构分层离线渲染）\n- **时区基准**：Asia/Shanghai (UTC+8)\n- **脚本入口**：`scripts/build-digest-site.ps1`\n- **安全白名单审计**：严格只读外部检索，无 Git 修改，无第三方代码执行，无外挂网络写入，运行锁机制完备。\n", "source": "appendix.md", "page_type": "appendix", "digest_href": "digest.html", "appendix_href": "appendix.html", "paper_href": "papers/URMIF_tpami2026.html", "appendix": null, "back": "digest.html"}</script>
