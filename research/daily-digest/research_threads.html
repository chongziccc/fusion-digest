### [QUESTION-001] 极端曝光与强梯度阶跃场景下跨模态结构注入的物理边界与渗漏判据
- **记录日期**：2026-11-06
- **来源与位置**：PCDFusion (NeurIPS 2026) Section 1 &amp; Section 3.3 (Fig. 1b, Fig. 6)；NatureFusion (2026) Intro ¶2。
- **已知事实**：
  1. 可见光在过曝（饱和）或欠曝（极暗）时局部对比度严重塌陷，无法提供可靠梯度与纹理。
  2. 红外图像虽对光照鲁棒，但在强辐射目标（行人、车灯）边缘具有极陡峭的高温阶跃，而在内部往往缺乏反射率结构；直接将红外梯度注入可见光常导致“光晕斑块（thermal halo）”或非物理虚影。
- **待验证解释**：
  是否能够通过一种连续介质界面松弛力学模型或局部非对称贝叶斯判定，将可见光“曝光失效区”与“正常纹理区”的过渡带严格限制为连续渐变流，从而在挽救失效区结构的同时，彻底阻断热辐射向正常可见光区域的无序渗透？
- **关联论文与 Idea**：PCDFusion (arxiv:2610.23663), NatureFusion (arxiv:2611.01607)；关联 [IDEA-001](idea_log.md)。
- **下一步**：在 MSRS 极端逆光数据集上统计过曝交界处梯度突变曲率分布，量化现有方法边界撕裂程度。

### [QUESTION-002] 跨模态引导的教师-学生蒸馏中，几何空间非对齐与生成幻觉的物理阻尼边界
- **记录日期**：2026-11-07
- **来源与位置**：NatureFusion (arXiv:2611.01607) Section III-D, Section IV-E (Table XI, XII) 及 Fig. 10。
- **已知事实**：
  1. NatureFusion 首次在实验上证实：以可见光为几何基准、仅将红外作为互补外推增量，在 8~32 像素剧烈非对齐下，下游冻结检测器（COCO YOLO11x）可维持 35% 以上的高精度（传统源保真度方法直接雪崩至 11% 以下）。
  2. 但其 Stage I 教师示范极度依赖人工框标注，且 9B 参数 DiT 基座在无标注野外开集场景下，存在凭空生成非真实可见光纹理（幻觉）的隐患。
- **待验证解释**：
  能否在轻量卷积或紧凑型网络中，通过引入多孔介质渗流力学的“毛细势垒”，在像素与浅层特征空间显式实现相同的抗非对齐鲁棒性，同时利用物理势能截断彻底隔绝生成式大模型的纹理幻觉？
- **关联论文与 Idea**：NatureFusion (arxiv:2611.01607)；关联 [IDEA-002](idea_log.md)。
- **下一步**：构建人工像素平移（8/16/32 px）测试脚本，对比局部势垒与标准注意力在错位区域的特征泄漏量。

### [QUESTION-003] 实例级可控融合在二值分割掩码边缘的空间导数发散与剪贴画伪影
- **记录日期**：2026-11-08
- **来源与位置**：ConFusion (ACM MM 2026 / arXiv:2607.23600) Section 3.2 (MGSM), Section 4.3 (Fig. 4 &amp; Fig. 7c)。
- **已知事实**：
  1. ConFusion 提出高斯条件连续调制流形，并在参数空间引入李普希茨范数惩罚 $\mathcal{L}_{\text{cont}}$，确保了控制变量 $z$ 连续微调时输出图像平滑演化。
  2. 但在空间维度 $(x,y)$ 上，其调制作用域依然由硬二值掩码 $M_k \in \{0, 1\}$ 或简单羽化掩码直接点乘限定，导致实例外沿的空间一阶与二阶导数出现阶跃间断，在高调制强度下产生可辨识的边缘剪贴画伪影与色阶断层。
- **待验证解释**：
  能否在空间坐标系中引入材料力学中的功能梯度材料（FGM）界面相容势场，将二值掩码转化为满足圣维南位移相容方程的连续体积分数场，从根本上杜绝实例可控融合的边界梯度奇异性？
- **关联论文与 Idea**：ConFusion (arxiv:2607.23600)；关联 [IDEA-003](idea_log.md)。
- **下一步**：在 MSRS 包含清晰行人前景与复杂街景背景的 50 对样本上，提取二值掩码外沿法向梯度剖面，量化分析空间相容性损失对边缘光晕的抑制效果。

### [QUESTION-004] 欧氏平直空间的度量饱和与树状层级语义表示崩溃，对跨模态非线性相关性的几何扭曲
- **记录日期**：2026-11-09
- **来源与位置**：TEDFusion (arXiv:2606.15104) Section 1, Section 4.3 (Fig. 8, Table 4)；ConFusion (ACM MM 2026) Section 3.2。
- **已知事实**：
  1. 传统多模态融合网络均嵌入在平直欧氏空间 $\mathbb{R}^d$ 中，其容积随半径仅呈多项式增长（$V(r) \propto r^d$），而语义概念与视觉特征的多尺度层级关系呈现指数级分叉的树状拓扑（Tree-like hierarchy）。
  2. TEDFusion 的协方差特征值衰减实验（Table 4）证实：欧氏特征空间前 3 个主成分急剧衰减至 0.17 以下，产生严重的“特征扁平化（Feature Flattening）”现象，迫使粗粒度场景语义与细粒度边缘高频挤压在低维子空间中，引发度量饱和与跨模态特征纠缠撕裂。
- **待验证解释**：
  能否在特征解耦阶段引入非欧黎曼/伪黎曼几何（如双曲庞加莱球或狭义相对论洛伦兹时空光锥），以负曲率的指数容积从根本上解耦宏观因果背景与局域热辐射，消除特征扁平化引发的模态失真？
- **关联论文与 Idea**：TEDFusion (arxiv:2606.15104), ConFusion (arxiv:2607.23600)；关联 [IDEA-004](idea_log.md)。
- **下一步**：提取 MSRS 数据集上典型红外与可见光特征的协方差谱分布，对比欧氏与双曲空间特征流形本征维数。

### [QUESTION-005] 2D 各向同性材质先验在掠射角菲涅尔效应下的退化解耦失效
- **记录日期**：2026-11-10
- **来源与位置**：SGPDFuse (ACM MM 2026 / arXiv:2608.29220) Section 3.1 &amp; Section 3.2 (SPPB)。
- **已知事实**：
  1. SGPDFuse 证明了传统加权特征聚合在非负环境退化下的不可约简性，并提出利用 DINOv3 语义先验构建“语义-物理参数桥（SPPB）”以剥离变化成分 $\Psi$。
  2. 但 SPPB 将材质发射率与反射率简化为各向同性的 2D 语义标量，忽略了在真实倾斜车身或光滑积水路面上，表面发射率 $\epsilon(\theta)$ 与反射率 $\rho(\theta)$ 会随着视线夹角 $\theta$（掠射角）急剧发生菲涅尔各向异性非线性变化。
- **待验证解释**：
  能否引入基尔霍夫辐射定律与角度依赖解耦势场，结合局部几何表面法向估计，在掠射角区域自适应增强反射衰减，从根本上杜绝金属与积水表面的虚假热鬼影？
- **关联论文与 Idea**：SGPDFuse (arxiv:2608.29220)；关联 [IDEA-005](idea_log.md)。
- **下一步**：在 MSRS 包含金属车辆侧向反光的夜间样本上，测试方向依赖衰减因子对虚假热轮廓残差的消除效果。

### [QUESTION-006] 实例级偏好微调中二值掩码带来的界面空间梯度阶跃与拼缝奇异性
- **记录日期**：2026-11-11
- **来源与位置**：DPOFusion (CVPR 2026 / arXiv:2605.06049) Section 4.3 (IDPO, Eq. 7-9)。
- **已知事实**：
  1. DPOFusion 提出实例级直接偏好优化（IDPO），通过在掩码内部 $z_m$ 执行似然对数加权更新，在掩码外部 $z_m^c$ 施加严苛基准像素一致性惩罚，在单一网络中成功实现多任务多主体偏好对齐。
  2. 但其空间掩码 $I_m \in \{0, 1\}$ 是硬二值分布，在掩码外沿交界线上，损失函数产生非平滑阶跃，法向空间一阶与二阶导数不连续，在较大微调强度下容易诱发局域光晕与拼缝色阶断层。
- **待验证解释**：
  能否引入材料热力学中的 Cahn-Hilliard 弥散界面模型，以金兹堡-朗道相场自由能方程将二值掩码替换为具有有限厚度与能量连续性的弥散相场，从根本上消除偏好微调交界面的数值梯度阶跃？
- **关联论文与 Idea**：DPOFusion (arxiv:2605.06049)；关联 [IDEA-006](idea_log.md)。
- **下一步**：提取 MSRS 局部微调区域外沿法向二阶导数剖面，对比二值掩码与弥散相场的边缘连续性。

### [QUESTION-007] 非等温野外大动态场景中环境反射辐射的二值温度凸组合近似在非朗伯界面的物理坍缩与虚假热伪影
- **记录日期**：2026-11-12
- **来源与位置**：TeX-Gen (arXiv:2611.10665) Section III-C.1 (Eq. 14-16) &amp; Section V-A。
- **已知事实**：
  1. TeX-Gen 成功摆脱了 HADAR 对极端昂贵高光谱成像硬件的依赖，在常规双光配对上通过 Stefan-Boltzmann 定律构建了无标签辐射损失 $\mathcal{L}_{rad}$。
  2. 但为了在单波段中求解环境反射辐射 $，它沿用了简化假设，将连续且方向依赖的复杂环境辐射硬编码为两个固定环境有效温度  = 293.15\text{K}$ 和  = 298.15\text{K}$ 的标量权重线性凸组合： = \sigma (V T_1^4 + (1-V) T_2^4)$。
  3. 在实际外场夜间复杂光照（如天空冷辐射 {sky} \approx 230\text{K}$~250K、炽热近光灯车灯、高温排气管局部照射地面及积水表面）下，有效环境温度的动态跨度极大（从 230K 到 350K+），且粗糙表面和积水表面的双向反射分布函数（BRDF）强烈各向异性。仅用两个固定窄带环境温度（跨度仅 5K）的凸组合，导致反射环境辐射建模能力受限，在强反射或冷天空下可能倒逼模型把未被解释的反射光错误吸收进物体自身温度 $ 或发射率 $，引发虚假高温斑块或发射率估计漂移。
- **待验证解释**：
  能否引入地表-冷天空双源辐射极值动态边界，并基于净辐射热通量守恒与各向异性双向反射平衡方程（BRDF Balance），约束环境反射辐射 $ 的空间连续性，消除固定窄温差假设下的虚假热伪影？
- **关联论文与 Idea**：TeX-Gen (arxiv:2611.10665), HADAR (Nature 2023)；关联 [IDEA-007](idea_log.md)。
- **下一步**：在 MSRS 包含金属车辆侧向反光与雨后积水路面的测试集上，提取高光反射区域的温度图 $ 残差，对比双固定温度基底与拓扑辐射流对虚假高亮伪影的抑制比率。

### [QUESTION-008] 频域解耦中旋转等变性与特异性细节自由度的几何冲突边界与自发对称破缺条件
- **记录日期**：2026-11-13
- **来源与位置**：RoES (ACM MM 2026 / arXiv:2609.12497) Section 1, Section 3.1 (Fig. 1, Fig. 3 &amp; Eq. 1)。
- **已知事实**：
  1. RoES 的受控实验证实：将旋转等变性（$C_4$ 群约束）严格限制在低频区域（阈值 $	au pprox 0.35$）时，融合图像的视觉保真度（VIF）达到峰值且伪影指标（$N_{abf}$）达到谷底；
  2. 若将等变约束扩展至高频全谱，高频细节因受到刚性对称性限制而产生严重过正则化，抹杀红外与可见光独有的非对称边缘和细密纹理，导致 VIF 与 MI 锐减。
- **待验证解释**：
  高频细节是否真的“完全不需要几何约束”？高频细节的非对称性是否服从某种“局部自发对称性破缺”物理机制？能否引入液晶弹性相场模型，在宏观连续区施加群对称性约束，而在局部剧烈微观边缘处自适应触发破缺门控？
- **关联论文与 Idea**：RoES (arxiv:2609.12497)；关联 [IDEA-008](idea_log.md)。
- **下一步**：在 MSRS 包含非正交纹理（倾斜栅栏、车牌斜角）的 50 对样本上，统计高频特征在不同旋转角度下的协方差能量损耗曲线，验证相场破缺门控对局部细节保真的理论增益。

### [QUESTION-009] 真实非严格配准场景中主平面单应性假设与 3D 前景视差跳变的连续介质形变撕裂矛盾
- **记录日期**：2026-11-14
- **来源与位置**：URMIF (IEEE TPAMI 2026, DOI: 10.1109/TPAMI.2026.3720312) Section 1, Section 3.2 (Dominant-Plane Prior, IDP &amp; VDP Losses) 及 Section 4.3。
- **已知事实**：
  1. 真实车载或无人机双光图像由于物理基线距离与场景三维深度起伏，必然存在非刚性视差（Parallax）。URMIF 提出主平面先验（Dominant-Plane Prior）与解耦通用表征（同质骨架与异质纹理），并引入 IDP/VDP 约束，极大改善了主平面（路面、墙面）的全局对齐（mTRE 压缩至 1.24 像素）。
  2. 但主平面先验本质上假定场景由单一方面单应性矩阵（Homography $\mathbf{H}_0$）主导。对于大幅突起于主平面的 3D 前景物体（如垂直站立的行人、路边立杆与近景车辆），其真实物理视差与背景路面存在沿深度轮廓法向的剧烈离散跃变（Displacement Jump）。
  3. 传统连续形变场（如光流、B-spline 或 URMIF 的层次变形场）受制于全变分（TV）或 $L_2$ 空间连续性正则化项（$\|\nabla \mathbf{u}\|^2$），强行平滑了前景边缘的视差跳变，导致前景轮廓在形变时出现类似“橡胶薄膜牵拉”的边缘拖尾、背景被拉扯撕裂以及目标边缘光晕。
- **待验证解释**：
  能否在前景语义深度边缘引入断裂与界面力学中的“内聚力模型（Cohesive Zone Model, CZM）”，允许形变场在语义轮廓处发生受控的离散位移跃变（Displacement Jump），在主平面内部保持连续弹性形变的同时，在 3D 目标轮廓处自适应吸收离散视差，消除橡胶拉扯伪影？
- **关联论文与 Idea**：URMIF (IEEE TPAMI 2026)；关联 [IDEA-009](idea_log.md)。
- **下一步**：在 RIVIR 真实未配准大视差样本对上，提取行人边缘法向形变场导数截面剖面，量化连续形变平滑约束在深度突变边缘的几何拉伸失真程度。

## 候选 Idea 深化

### [IDEA-001] 界面应力松弛流（Interfacial Stress Relaxation Flow）用于消除融合边界光晕与阶跃撕裂
- **当前假设**：
  将多模态融合边缘视为力学中两个异质界面的接触变形过程，红外强边缘等价于刚性滑移体，可见光背景等价于连续基底。引入连续介质接触力学中的摩擦耗散松弛算子 $\mathcal{D}_{\text{relax}}$，能够在强梯度交界处自适应吸收反向或失配应力，使边缘过渡保持物理平滑，消除阶跃撕裂与亮圈光晕。
- **成立条件**：
  1. 红外与可见光图像已完成粗对齐（像素位移在 2 像素以内）；
  2. 红外目标边缘具有单调辐射阶跃，且可见光对应区域存在局域连续性。
- **可区分预测**：
  相比标准梯度最大化损失 $\max(|\nabla Y_v|, |\nabla Y_r|)$，引入应力松弛算子后，融合图像在目标边界法向上的高阶二阶导数极值方差下降 30% 以上，肉眼无亮线光晕，且 Qabf 指标不降反升。
- **替代解释与区分对照**：
  - *替代解释 A*：光晕消除可能仅仅是因为高斯模糊或简单双边滤波滤除了高频。
  - *区分对照*：对比组加入针对红外的高斯低通滤波。如果松弛机制有效，其在消除光晕的同时必须完整保留红外目标内部的高对比度边缘（高频细节不丢失），而低通滤波会导致整体边缘弥散。
- **最近邻工作与查重**：
  - 传统 TV (Total Variation) 正则：各向同性平滑，全图模糊，无模态自适应性；
  - PCDFusion (NeurIPS 2026)：采用带通滤波 $B(Y_r)$ 约束红外残差，但未在空间边界显式建立接触滑移能量耗散方程；
  - 结论：机制具备独立创新性。
- **否定条件**：
  若在细微树枝、密集栅栏等高频复杂重叠纹理区，应力松弛算子将真实的精细边缘误判为阶跃撕裂并予以过度抹平，导致空间频率 (SF) 或 AG 下降超过 15%，则假设被否定。
- **下一步最小验证方案**：
  构建一个 30 行 PyTorch 边界测试函数，输入 50 对 MSRS 边界裁块，比较 Baseline 与松弛损失输出的法向梯度截面轮廓。

### [IDEA-002] 多孔介质毛细势垒跨模态定向渗流机制（Capillary Barrier Infiltration Control）
- **当前假设**：
  将多模态融合过程等价于多孔介质中两相流体的渗流过程：可见光背景构成具有非均质孔隙度的基底介质，红外热辐射作为试图穿透界面的非润湿流体相。在介质交界面上，表面张力形成“毛细进入压力势垒（Capillary Barrier, $P_c^\star$）”。依据可见光局部曝光置信度与高频梯度构建阻尼势场：在可见光结构清晰区域，势垒高度趋于无穷，彻底阻绝热辐射扩散（杜绝惨白热斑膏药）；仅在可见光完全暗化或过曝失效的区域，毛细势垒自适应击穿，允许红外目标轮廓定向渗流注入。
- **成立条件**：
  1. 可见光图像能够通过局部照度与拉普拉斯能量准确区分“结构完好区”与“信息塌陷区”；
  2. 红外图像在对应塌陷区能够提供高于噪声基底的目标连续轮廓。
- **可区分预测**：
  在车灯直射和完全背光的极端场景下，相比 NatureFusion 与传统方法，毛细势垒渗流不仅在可见光正常区实现 100% 自然色彩与纹理保真（零热斑污染），而且在 16 像素非对齐测试中，错位区域的伪影轮廓响应衰减 40% 以上。
- **替代解释与区分对照**：
  - *替代解释*：势垒可能仅仅退化为简单的局部照度门控（Masking）。
  - *区分对照*：对比组采用硬阈值照度门控。如果毛细渗流机制有效，其在势垒击穿过渡带上应呈现符合达西渗流定律的连续非线性压力梯度，边缘无硬截断阶跃伪影；而硬门控会导致拼接缝与色阶断层。
- **最近邻工作与查重**：
  - NatureFusion (arXiv 2026)：通过 DiT 隐层差分向量 $\Delta_{ir}$ 实现互补放大，无空间物理渗流解释，计算量极大；
  - 传统引导滤波（Guided Filter）：全图平滑滤波，无相变与势垒击穿机制；
  - 查重结论：多孔介质毛细势垒与渗流相变方程在 IVIF 中未见先例，机理独立。
- **否定条件**：
  若在弥散性低对比度红外目标（如被浓雾遮蔽的远距离行人）处，毛细势垒由于可见光噪声扰动无法稳定击穿，导致目标漏检率 $R_{miss}$ 显著劣于传统加权融合，则假设需修正或否定。
- **下一步最小验证方案**：
  在 MSRS 包含 50 对极端夜间样本的测试集上，设计 20 行毛细阻尼势场张量运算，可视化势垒阻绝与渗流分布图。

### [IDEA-003] 功能梯度材料 (FGM) 空间相容性机制用于消除实例级可控融合边界撕裂
- **当前假设**：
  将多模态融合的实例调制权重视为复合材料中两种不同组分的连续体积分数场 $V_f(x,y)$。红外显著特征等价于高刚度陶瓷相，可见光背景等价于高韧性金属相。依据材料力学中的功能梯度材料（FGM）界面过渡理论，在空间维度引入基于符号距离变换（SDF）的 Sigmoidal 连续过渡剖面，并施加圣维南位移相容性正则损失 $\mathcal{L}_{\text{comp}} = \|\nabla \times \nabla F_{\text{fuse}}\|_2^2$。该机制能够从数学上保证实例外沿一阶与二阶空间导数处处连续，彻底消除二值掩码带来的剪贴画拼缝与边界光晕。
- **成立条件**：
  1. 场景中可由检测器或分割模型（如 Grounded-SAM-2）提供目标初始掩码或边界框；
  2. 目标外沿具有局部背景邻域支持，过渡带宽 $W$ 可根据局部图像对比度自适应调节（通常在 3~7 像素以内）。
- **可区分预测**：
  在实例大幅度增强（如高斯调制强度 $z = +2.0$）的极限工况下，引入 FGM 空间相容性机制后，实例外沿法向二阶导数极值方差下降 45% 以上，人眼主观评估无任何硬拼接断层，且全图 Qabf 相比标准掩码调制提升 0.03 以上。
- **替代解释与区分对照**：
  - *替代解释*：边缘平滑可能仅仅是因为高斯模糊或简单羽化（Feathering）滤除了高频。
  - *区分对照*：对比组采用标准 5x5 高斯滤波羽化掩码。如果 FGM 相容性机制有效，其在消除边缘断层撕裂的同时，目标内部及真实边缘的高频几何结构完整度（空间频率 SF）应保持 95% 以上，而普通高斯羽化会导致轮廓弥散模糊。
- **最近邻工作与查重**：
  - ConFusion (ACM MM 2026)：仅在参数空间引入李普希茨范数，空间维度仍依赖二值掩码；
  - 传统 Alpha 抠图融合：依赖手工精细 Trimap，计算缓慢且缺乏物理相容力学理论支持；
  - 查重结论：FGM 空间相容性方程在 IVIF 可控融合中属机理首创。
- **否定条件**：
  若在细长微小目标（如远处只有 2~3 像素宽的电线或纤细树枝）处，FGM 过渡带导致目标内部有效对比度被过度均质化，导致目标显著度下降超过 20%，则假设需修正或限制最小尺度。
- **下一步最小验证方案**：
  在 MSRS 提取 30 个包含典型行人与车辆边界的局部图像块，用 30 行 PyTorch 脚本计算 SDF 梯度势场，对比二值掩码、高斯羽化与 FGM 相容调制的法向截面线。

### [IDEA-005] 基尔霍夫各向异性辐射-反射解耦势场
- **当前假设**：
  基于基尔霍夫辐射能量守恒 $\epsilon(\theta) + \rho(\theta) = 1$，在表面法向与视线观测方向夹角 $\theta \to 90^\circ$（掠射角）时，反射率剧烈增加而发射率急剧衰减。引入局部表面法向估计构造角度依赖解耦场 $W_{ij}^{aniso} = \epsilon_0 \cos^p(\theta_{ij})$，能动态压制倾斜金属车漆与积水表面的虚假热鬼影。
- **成立条件**：
  1. 可通过预训练单目法向估计器（如 Marigold/DSINE）获取粗粒度表面法向 $\mathbf{n}$；
  2. 场景中金属与水面遵循平滑反射物理规律。
- **可区分预测**：
  在倾角 $&gt;60^\circ$ 的侧向车辆与积水倒影区域，虚假热反射残差抑制率达 50% 以上，同时保持物体真实高温轮廓清晰。
- **替代解释与区分对照**：
  - *替代解释*：可能只是全局降低了红外权重。
  - *区分对照*：对比各向同性固定权重截断。本机制仅在掠射角区域自适应衰减反射，法向正对区域发射率维持 100%。
- **最近邻工作与查重**：
  SGPDFuse (ACM MM 2026) 仅使用各向同性 2D 语义标量；HADAR 仅在纯红外测温中探索。本项在双模态融合中引入基尔霍夫角度辐射场属机理首创。
- **否定条件**：
  若在法向估计严重误差或粗糙漫反射表面导致有效热目标被误削弱，则假设需修正。
- **下一步最小验证方案**：
  在 MSRS 包含金属车辆侧向反光的夜间样本上，测试方向依赖衰减因子对虚假热轮廓残差的消除效果。

### [IDEA-006] 弥散界面相场偏好对齐机制（DIP-Align）
- **当前假设**：
  将多模态融合的局域偏好调控域与背景基准域类比为材料热力学中的互溶两相系统。抛弃二值空间掩码，引入满足金兹堡-朗道（Ginzburg-Landau）自由能泛函的连续弥散相场 $\Phi_{diffuse} \in [0, 1]$，并通过梯度能项惩罚过大界面曲率。该机制能够从物理与数值上杜绝实例级偏好微调在交界处的梯度阶跃奇异性，消除边缘拼缝伪影。
- **成立条件**：
  1. 用户或任务给出的初始区域可通过距离变换转化为光滑相场分布；
  2. 偏好微调区域具有局域连续过渡特征。
- **可区分预测**：
  在大强度偏好微调下，相比硬掩码 IDPO，交界面法向二阶导数极值方差下降 40% 以上，人眼感知无任何硬拼接断层，且全局图像质量指标（MUSIQ / CNNIQA）保持最优。
- **替代解释与区分对照**：
  - *替代解释*：可能只是高斯模糊掩码。
  - *区分对照*：对比组采用简单高斯羽化掩码。弥散相场机制在界面处具有严格热力学能量极小化约束，过渡区既平滑又紧凑，而高斯模糊会导致调控区域弥散扩大并降低目标清晰度。
- **最近邻工作与查重**：
  DPOFusion (CVPR 2026) 采用硬掩码 IDPO；PatchDPO/FocusDPO 仅在文生图中探索局部注意力。在 IVIF 中引入弥散相场偏好微调属机理首创。
- **否定条件**：
  若在极微小目标（$&lt;3$ 像素）处相场过渡区占比过大导致偏好特性被过度稀释，则假设需针对微小尺度补充尺度自适应修正。
- **下一步最小验证方案**：
  编写 25 行 PyTorch 脚本，在 MSRS 样本上对比二值掩码、高斯羽化与弥散相场的法向二阶导数剖面。

### [IDEA-009] 内聚界面位移跃变机制（Cohesive Interface Displacement Jump, CIDJ）用于消除非配准 IVIF 中 3D 前景橡胶膜拉伸伪影
- **当前假设**：
  将非严格配准场景中的多模态变形场分解为“基准主平面连续弹性形变场”与“3D 前景界面内聚位移跃变场”。在语义深度边缘线 $\Gamma$ 上，打破传统的空间连续性导数惩罚，代之以固体力学内聚力模型（CZM）的牵引力-分离软化势能 $\mathcal{E}_{\text{cohesive}}([\![ \mathbf{u} ]\!])$，允许前景目标发生有限的刚体位移跳跃，从机理上终结大视差目标边缘的橡胶膜拉伸与光晕撕裂。
- **成立条件**：
  1. 场景中存在明确的主导背景平面（如路面、天空或建筑立面）；
  2. 3D 前景目标（行人、车辆）具有清晰的语义轮廓或深度分界面，且前景内部保持相对刚性或连续变形。
- **可区分预测**：
  在近景大视差未配准测试集中，引入内聚位移跃变机制后，前景目标边界处的法向梯度过渡带宽度缩窄 35% 以上，局部重影伪影指标 $N_{abf}$ 降低 25% 以上，且背景主平面的几何平滑度不受破坏。
- **替代解释与区分对照**：
  - *替代解释 A*：伪影消除可能仅仅来自于前景分割掩码的简单硬贴入（Cut-and-Paste）。
  - *区分对照*：对比组加入前景硬掩码直接裁剪拼接。内聚跃变机制在允许位移跳变的同时，仍通过内聚牵引力势能维持界面处的特征能量连续性，不会产生硬剪贴画断层；而硬贴入会在交界处产生阶跃撕裂。
- **最近邻工作与查重**：
  - 传统 TV- $L_2$ 光流平滑：全局强制连续，导致大视差边缘橡胶薄膜拉伸；
  - URMIF (IEEE TPAMI 2026)：采用分层变形估计与主平面先验，但局部变形场仍沿用连续平滑假设；
  - 结论：尚无将 CZM 位移跃变势能应用于 IVIF 视差解耦的先例，属力学机制创新。
- **否定条件**：
  若在无深度起伏的平坦墙面或远景开阔地带，内聚跃变算子发生误判触发，导致图像局部产生非物理的裂纹或位移断层，且 mTRE 误差恶化超过 10%，则假设被否定。
- **下一步最小验证方案**：
  编写 20 行 PyTorch 单元测试脚本，在 RIVIR 典型行人未配准样本上对比经典连续平滑光流与内聚跃变变形场的法向梯度过渡截面。

## 周度跨论文综合（2026-11-06 首期综合）

- **综合范围**：首期冷启动切片覆盖之近期前沿工作（PCDFusion, NatureFusion, RealFusion, DDFusion）。
- **共同问题**：
  各主流研究群体正一致放弃“将红外与可见光视为对称特征并直接做通道/注意力拼接”的旧范式，全面转向**物理非对称性与局部可靠性冲突的显式建模**。
- **不同解释与证据分歧**：
  1. *PCDFusion (NeurIPS 2026)* 认为矛盾的核心在于“局部动作决策的缺乏”，主张以可见光为核心锚点，通过贝叶斯后验机制分 Proposal、Context、Detail 三阶段注入红外信息；
  2. *NatureFusion (Wuhan Univ, 2026-11)* 认为现有矛盾源于无监督训练下对源图像保真度的盲目追求，直接把热辐射当作亮斑贴在可见光上破坏了自然分布，主张利用生成式 Foundation Model 作为 Teacher 重新定义为“自然补全增强”；
  3. *RealFusion (IEEE TIP, 2026)* 则从模态不变性空间出发，试图通过解耦光照变化来寻找模态共性。
- **本周推进建议**：
  建议将探索重心聚焦于 **PCDFusion 的三阶段物理先验锚定逻辑** 与 **IDEA-001 界面接触松弛机制** 的结合。前者提供了清晰的贝叶斯局部证据校准，后者可在物理层面彻底解决前者在 Detail 阶段单纯依赖带通滤波可能残留的微小边界应力撕裂。
- **下一步最能区分解释的行动**：
  在具有严重曝光饱和失效与树枝遮挡的夜间街景场景下，提取 PCDFusion 与 NatureFusion 的融合特征层，观察其在饱和区边界的激活热图是否有非物理外溢。

## 周度跨论文综合（2026-11-09 第二期综合：向非欧几何与物理可控融合深度收敛）

- **综合范围**：近 180 天完成精读之四大前沿代表性工作（PCDFusion, NatureFusion, ConFusion, TEDFusion）。
- **共同问题与范式跃迁**：
  经过近一周对顶级会议与前沿预印本的纵深研读，可以清晰看到 IVIF 领域正经历深刻的三大范式跃迁：
  1. **从“对称拼接”走向“物理非对称引导”**：早期将两模态均等对待的注意力/CNN 结构已彻底退潮，以 PCDFusion（贝叶斯先验）和 NatureFusion（可见光基底+红外互补增量）为代表，确立了非对称性融合的公理地位。
  2. **从“无约束黑盒”走向“连续流形与可控调制”**：ConFusion（ACM MM 2026）打破了传统分类离散 Prompt 的桎梏，利用高斯空间调制变量证明了融合空间连续化的可行性与优越性。
  3. **从“平直欧氏空间”走向“非欧曲率流形表征”**：今日精读的 TEDFusion（arXiv 2026）从根本上揭示了欧氏空间的度量饱和与特征扁平化缺陷，首次用双曲几何（Poincaré 球）证明了负曲率空间对多尺度树状层级语义的天然容纳优势。
- **机制分歧与未决矛盾**：
  - *分歧一（生成式 vs. 几何判别式）*：NatureFusion 依赖 9B DiT 大模型蒸馏以消除热斑，但计算成本极高且存在开集幻觉隐患；而 TEDFusion 表明，仅需在轻量 ViT 骨干上引入双曲流形与属性门控，即可在推理期免文本（Text-Free）实现同等优异的场景自适应性。
  - *分歧二（参数空间连续 vs. 空间几何相容）*：ConFusion 在参数空间实现了李普希茨平滑，但二值掩码在物理空间导致剪贴痕；TEDFusion 在特征流形实现了非欧连续，但在空间像素域仍缺乏严格的界面力学连续性约束。
- **本周集中深化建议（1~2 个核心候选）**：
  1. **重点推进 [IDEA-003] 与 [IDEA-004] 的几何力学交叉融合**：将 ConFusion 的实例连续调制与 TEDFusion 的双曲/伪黎曼度规结合，构建一个“在特征空间具有双曲树状容积、在空间坐标具有功能梯度相容性”的统一非欧融合体系。
  2. **暂缓高开销的生成式大模型路线**：不盲目追随 9B 参数的 DiT/Flow Matching 重型方案，坚守“单卡可验证、物理几何强可解释性”的科研主线。
- **下一步最能区分机理的行动**：
  在具有明显多尺度物体（远景建筑、中景车辆、近景行人）的街景样本上，分别绘制欧氏特征与双曲特征的 t-SNE / UMAP 投影图与协方差谱，实证证明非欧流形对层级语义聚类的优越性。

## 论文论证卡

### [CARD-IDEA-001] 基于接触力学界面松弛的无伪影红外-可见光图像融合
- **具体问题与价值**：
  IVIF 长期受困于强红外目标边缘的“光晕撕裂”伪影。现有损失函数强制拉大梯度导致边缘局部应力集中与非自然亮环，直接损害人眼自然感与下游分割检测精度。
- **现有方法不足**：
  TarDAL、CDDFuse、SwinFusion 等均采用显式或隐式梯度最大化，无法区分目标真实几何轮廓与跨模态幅值失配导致的假边缘；PCDFusion 仅用带通滤波做启发式截断。
- **核心假设与候选贡献**：

<script type="application/json" id="reader-data">{"kind": "article", "date": "研究台账", "home": "index.html", "title": "关键学术脉络与周度综合", "status": "持续维护", "source": "research_threads.md", "markdown": "# 研究问题、周度综合与论文论证素材\n\n依据：[运行手册 9.1–9.3](../../scripts/daily-fusion-digest.runbook.md)。\n初始化日期：2026-11-06（北京时间）。\n最近一次周度综合：2026-11-09（第二期跨论文综合与非欧几何收敛）。\n\n---\n\n## 问题清单与演化\n\n### [QUESTION-001] 极端曝光与强梯度阶跃场景下跨模态结构注入的物理边界与渗漏判据\n- **记录日期**：2026-11-06\n- **来源与位置**：PCDFusion (NeurIPS 2026) Section 1 \u0026 Section 3.3 (Fig. 1b, Fig. 6)；NatureFusion (2026) Intro ¶2。\n- **已知事实**：\n  1. 可见光在过曝（饱和）或欠曝（极暗）时局部对比度严重塌陷，无法提供可靠梯度与纹理。\n  2. 红外图像虽对光照鲁棒，但在强辐射目标（行人、车灯）边缘具有极陡峭的高温阶跃，而在内部往往缺乏反射率结构；直接将红外梯度注入可见光常导致“光晕斑块（thermal halo）”或非物理虚影。\n- **待验证解释**：\n  是否能够通过一种连续介质界面松弛力学模型或局部非对称贝叶斯判定，将可见光“曝光失效区”与“正常纹理区”的过渡带严格限制为连续渐变流，从而在挽救失效区结构的同时，彻底阻断热辐射向正常可见光区域的无序渗透？\n- **关联论文与 Idea**：PCDFusion (arxiv:2610.23663), NatureFusion (arxiv:2611.01607)；关联 [IDEA-001](idea_log.md)。\n- **下一步**：在 MSRS 极端逆光数据集上统计过曝交界处梯度突变曲率分布，量化现有方法边界撕裂程度。\n\n### [QUESTION-002] 跨模态引导的教师-学生蒸馏中，几何空间非对齐与生成幻觉的物理阻尼边界\n- **记录日期**：2026-11-07\n- **来源与位置**：NatureFusion (arXiv:2611.01607) Section III-D, Section IV-E (Table XI, XII) 及 Fig. 10。\n- **已知事实**：\n  1. NatureFusion 首次在实验上证实：以可见光为几何基准、仅将红外作为互补外推增量，在 8~32 像素剧烈非对齐下，下游冻结检测器（COCO YOLO11x）可维持 35% 以上的高精度（传统源保真度方法直接雪崩至 11% 以下）。\n  2. 但其 Stage I 教师示范极度依赖人工框标注，且 9B 参数 DiT 基座在无标注野外开集场景下，存在凭空生成非真实可见光纹理（幻觉）的隐患。\n- **待验证解释**：\n  能否在轻量卷积或紧凑型网络中，通过引入多孔介质渗流力学的“毛细势垒”，在像素与浅层特征空间显式实现相同的抗非对齐鲁棒性，同时利用物理势能截断彻底隔绝生成式大模型的纹理幻觉？\n- **关联论文与 Idea**：NatureFusion (arxiv:2611.01607)；关联 [IDEA-002](idea_log.md)。\n- **下一步**：构建人工像素平移（8/16/32 px）测试脚本，对比局部势垒与标准注意力在错位区域的特征泄漏量。\n\n### [QUESTION-003] 实例级可控融合在二值分割掩码边缘的空间导数发散与剪贴画伪影\n- **记录日期**：2026-11-08\n- **来源与位置**：ConFusion (ACM MM 2026 / arXiv:2607.23600) Section 3.2 (MGSM), Section 4.3 (Fig. 4 \u0026 Fig. 7c)。\n- **已知事实**：\n  1. ConFusion 提出高斯条件连续调制流形，并在参数空间引入李普希茨范数惩罚 $\\mathcal{L}_{\\text{cont}}$，确保了控制变量 $z$ 连续微调时输出图像平滑演化。\n  2. 但在空间维度 $(x,y)$ 上，其调制作用域依然由硬二值掩码 $M_k \\in \\{0, 1\\}$ 或简单羽化掩码直接点乘限定，导致实例外沿的空间一阶与二阶导数出现阶跃间断，在高调制强度下产生可辨识的边缘剪贴画伪影与色阶断层。\n- **待验证解释**：\n  能否在空间坐标系中引入材料力学中的功能梯度材料（FGM）界面相容势场，将二值掩码转化为满足圣维南位移相容方程的连续体积分数场，从根本上杜绝实例可控融合的边界梯度奇异性？\n- **关联论文与 Idea**：ConFusion (arxiv:2607.23600)；关联 [IDEA-003](idea_log.md)。\n- **下一步**：在 MSRS 包含清晰行人前景与复杂街景背景的 50 对样本上，提取二值掩码外沿法向梯度剖面，量化分析空间相容性损失对边缘光晕的抑制效果。\n\n---\n\n\n### [QUESTION-004] 欧氏平直空间的度量饱和与树状层级语义表示崩溃，对跨模态非线性相关性的几何扭曲\n- **记录日期**：2026-11-09\n- **来源与位置**：TEDFusion (arXiv:2606.15104) Section 1, Section 4.3 (Fig. 8, Table 4)；ConFusion (ACM MM 2026) Section 3.2。\n- **已知事实**：\n  1. 传统多模态融合网络均嵌入在平直欧氏空间 $\\mathbb{R}^d$ 中，其容积随半径仅呈多项式增长（$V(r) \\propto r^d$），而语义概念与视觉特征的多尺度层级关系呈现指数级分叉的树状拓扑（Tree-like hierarchy）。\n  2. TEDFusion 的协方差特征值衰减实验（Table 4）证实：欧氏特征空间前 3 个主成分急剧衰减至 0.17 以下，产生严重的“特征扁平化（Feature Flattening）”现象，迫使粗粒度场景语义与细粒度边缘高频挤压在低维子空间中，引发度量饱和与跨模态特征纠缠撕裂。\n- **待验证解释**：\n  能否在特征解耦阶段引入非欧黎曼/伪黎曼几何（如双曲庞加莱球或狭义相对论洛伦兹时空光锥），以负曲率的指数容积从根本上解耦宏观因果背景与局域热辐射，消除特征扁平化引发的模态失真？\n- **关联论文与 Idea**：TEDFusion (arxiv:2606.15104), ConFusion (arxiv:2607.23600)；关联 [IDEA-004](idea_log.md)。\n- **下一步**：提取 MSRS 数据集上典型红外与可见光特征的协方差谱分布，对比欧氏与双曲空间特征流形本征维数。\n\n### [QUESTION-005] 2D 各向同性材质先验在掠射角菲涅尔效应下的退化解耦失效\n- **记录日期**：2026-11-10\n- **来源与位置**：SGPDFuse (ACM MM 2026 / arXiv:2608.29220) Section 3.1 \u0026 Section 3.2 (SPPB)。\n- **已知事实**：\n  1. SGPDFuse 证明了传统加权特征聚合在非负环境退化下的不可约简性，并提出利用 DINOv3 语义先验构建“语义-物理参数桥（SPPB）”以剥离变化成分 $\\Psi$。\n  2. 但 SPPB 将材质发射率与反射率简化为各向同性的 2D 语义标量，忽略了在真实倾斜车身或光滑积水路面上，表面发射率 $\\epsilon(\\theta)$ 与反射率 $\\rho(\\theta)$ 会随着视线夹角 $\\theta$（掠射角）急剧发生菲涅尔各向异性非线性变化。\n- **待验证解释**：\n  能否引入基尔霍夫辐射定律与角度依赖解耦势场，结合局部几何表面法向估计，在掠射角区域自适应增强反射衰减，从根本上杜绝金属与积水表面的虚假热鬼影？\n- **关联论文与 Idea**：SGPDFuse (arxiv:2608.29220)；关联 [IDEA-005](idea_log.md)。\n- **下一步**：在 MSRS 包含金属车辆侧向反光的夜间样本上，测试方向依赖衰减因子对虚假热轮廓残差的消除效果。\n\n### [QUESTION-006] 实例级偏好微调中二值掩码带来的界面空间梯度阶跃与拼缝奇异性\n- **记录日期**：2026-11-11\n- **来源与位置**：DPOFusion (CVPR 2026 / arXiv:2605.06049) Section 4.3 (IDPO, Eq. 7-9)。\n- **已知事实**：\n  1. DPOFusion 提出实例级直接偏好优化（IDPO），通过在掩码内部 $z_m$ 执行似然对数加权更新，在掩码外部 $z_m^c$ 施加严苛基准像素一致性惩罚，在单一网络中成功实现多任务多主体偏好对齐。\n  2. 但其空间掩码 $I_m \\in \\{0, 1\\}$ 是硬二值分布，在掩码外沿交界线上，损失函数产生非平滑阶跃，法向空间一阶与二阶导数不连续，在较大微调强度下容易诱发局域光晕与拼缝色阶断层。\n- **待验证解释**：\n  能否引入材料热力学中的 Cahn-Hilliard 弥散界面模型，以金兹堡-朗道相场自由能方程将二值掩码替换为具有有限厚度与能量连续性的弥散相场，从根本上消除偏好微调交界面的数值梯度阶跃？\n- **关联论文与 Idea**：DPOFusion (arxiv:2605.06049)；关联 [IDEA-006](idea_log.md)。\n- **下一步**：提取 MSRS 局部微调区域外沿法向二阶导数剖面，对比二值掩码与弥散相场的边缘连续性。\n\n---\n\n### [QUESTION-007] 非等温野外大动态场景中环境反射辐射的二值温度凸组合近似在非朗伯界面的物理坍缩与虚假热伪影\n- **记录日期**：2026-11-12\n- **来源与位置**：TeX-Gen (arXiv:2611.10665) Section III-C.1 (Eq. 14-16) \u0026 Section V-A。\n- **已知事实**：\n  1. TeX-Gen 成功摆脱了 HADAR 对极端昂贵高光谱成像硬件的依赖，在常规双光配对上通过 Stefan-Boltzmann 定律构建了无标签辐射损失 $\\mathcal{L}_{rad}$。\n  2. 但为了在单波段中求解环境反射辐射 $，它沿用了简化假设，将连续且方向依赖的复杂环境辐射硬编码为两个固定环境有效温度  = 293.15\\text{K}$ 和  = 298.15\\text{K}$ 的标量权重线性凸组合： = \\sigma (V T_1^4 + (1-V) T_2^4)$。\n  3. 在实际外场夜间复杂光照（如天空冷辐射 {sky} \\approx 230\\text{K}$~250K、炽热近光灯车灯、高温排气管局部照射地面及积水表面）下，有效环境温度的动态跨度极大（从 230K 到 350K+），且粗糙表面和积水表面的双向反射分布函数（BRDF）强烈各向异性。仅用两个固定窄带环境温度（跨度仅 5K）的凸组合，导致反射环境辐射建模能力受限，在强反射或冷天空下可能倒逼模型把未被解释的反射光错误吸收进物体自身温度 $ 或发射率 $，引发虚假高温斑块或发射率估计漂移。\n- **待验证解释**：\n  能否引入地表-冷天空双源辐射极值动态边界，并基于净辐射热通量守恒与各向异性双向反射平衡方程（BRDF Balance），约束环境反射辐射 $ 的空间连续性，消除固定窄温差假设下的虚假热伪影？\n- **关联论文与 Idea**：TeX-Gen (arxiv:2611.10665), HADAR (Nature 2023)；关联 [IDEA-007](idea_log.md)。\n- **下一步**：在 MSRS 包含金属车辆侧向反光与雨后积水路面的测试集上，提取高光反射区域的温度图 $ 残差，对比双固定温度基底与拓扑辐射流对虚假高亮伪影的抑制比率。\n\n---\n\n### [QUESTION-008] 频域解耦中旋转等变性与特异性细节自由度的几何冲突边界与自发对称破缺条件\n- **记录日期**：2026-11-13\n- **来源与位置**：RoES (ACM MM 2026 / arXiv:2609.12497) Section 1, Section 3.1 (Fig. 1, Fig. 3 \u0026 Eq. 1)。\n- **已知事实**：\n  1. RoES 的受控实验证实：将旋转等变性（$C_4$ 群约束）严格限制在低频区域（阈值 $\tau \u0007pprox 0.35$）时，融合图像的视觉保真度（VIF）达到峰值且伪影指标（$N_{abf}$）达到谷底；\n  2. 若将等变约束扩展至高频全谱，高频细节因受到刚性对称性限制而产生严重过正则化，抹杀红外与可见光独有的非对称边缘和细密纹理，导致 VIF 与 MI 锐减。\n- **待验证解释**：\n  高频细节是否真的“完全不需要几何约束”？高频细节的非对称性是否服从某种“局部自发对称性破缺”物理机制？能否引入液晶弹性相场模型，在宏观连续区施加群对称性约束，而在局部剧烈微观边缘处自适应触发破缺门控？\n- **关联论文与 Idea**：RoES (arxiv:2609.12497)；关联 [IDEA-008](idea_log.md)。\n- **下一步**：在 MSRS 包含非正交纹理（倾斜栅栏、车牌斜角）的 50 对样本上，统计高频特征在不同旋转角度下的协方差能量损耗曲线，验证相场破缺门控对局部细节保真的理论增益。\n\n### [QUESTION-009] 真实非严格配准场景中主平面单应性假设与 3D 前景视差跳变的连续介质形变撕裂矛盾\n- **记录日期**：2026-11-14\n- **来源与位置**：URMIF (IEEE TPAMI 2026, DOI: 10.1109/TPAMI.2026.3720312) Section 1, Section 3.2 (Dominant-Plane Prior, IDP \u0026 VDP Losses) 及 Section 4.3。\n- **已知事实**：\n  1. 真实车载或无人机双光图像由于物理基线距离与场景三维深度起伏，必然存在非刚性视差（Parallax）。URMIF 提出主平面先验（Dominant-Plane Prior）与解耦通用表征（同质骨架与异质纹理），并引入 IDP/VDP 约束，极大改善了主平面（路面、墙面）的全局对齐（mTRE 压缩至 1.24 像素）。\n  2. 但主平面先验本质上假定场景由单一方面单应性矩阵（Homography $\\mathbf{H}_0$）主导。对于大幅突起于主平面的 3D 前景物体（如垂直站立的行人、路边立杆与近景车辆），其真实物理视差与背景路面存在沿深度轮廓法向的剧烈离散跃变（Displacement Jump）。\n  3. 传统连续形变场（如光流、B-spline 或 URMIF 的层次变形场）受制于全变分（TV）或 $L_2$ 空间连续性正则化项（$\\|\\nabla \\mathbf{u}\\|^2$），强行平滑了前景边缘的视差跳变，导致前景轮廓在形变时出现类似“橡胶薄膜牵拉”的边缘拖尾、背景被拉扯撕裂以及目标边缘光晕。\n- **待验证解释**：\n  能否在前景语义深度边缘引入断裂与界面力学中的“内聚力模型（Cohesive Zone Model, CZM）”，允许形变场在语义轮廓处发生受控的离散位移跃变（Displacement Jump），在主平面内部保持连续弹性形变的同时，在 3D 目标轮廓处自适应吸收离散视差，消除橡胶拉扯伪影？\n- **关联论文与 Idea**：URMIF (IEEE TPAMI 2026)；关联 [IDEA-009](idea_log.md)。\n- **下一步**：在 RIVIR 真实未配准大视差样本对上，提取行人边缘法向形变场导数截面剖面，量化连续形变平滑约束在深度突变边缘的几何拉伸失真程度。\n\n---\n\n## 候选 Idea 深化\n\n### [IDEA-001] 界面应力松弛流（Interfacial Stress Relaxation Flow）用于消除融合边界光晕与阶跃撕裂\n- **当前假设**：\n  将多模态融合边缘视为力学中两个异质界面的接触变形过程，红外强边缘等价于刚性滑移体，可见光背景等价于连续基底。引入连续介质接触力学中的摩擦耗散松弛算子 $\\mathcal{D}_{\\text{relax}}$，能够在强梯度交界处自适应吸收反向或失配应力，使边缘过渡保持物理平滑，消除阶跃撕裂与亮圈光晕。\n- **成立条件**：\n  1. 红外与可见光图像已完成粗对齐（像素位移在 2 像素以内）；\n  2. 红外目标边缘具有单调辐射阶跃，且可见光对应区域存在局域连续性。\n- **可区分预测**：\n  相比标准梯度最大化损失 $\\max(|\\nabla Y_v|, |\\nabla Y_r|)$，引入应力松弛算子后，融合图像在目标边界法向上的高阶二阶导数极值方差下降 30% 以上，肉眼无亮线光晕，且 Qabf 指标不降反升。\n- **替代解释与区分对照**：\n  - *替代解释 A*：光晕消除可能仅仅是因为高斯模糊或简单双边滤波滤除了高频。\n  - *区分对照*：对比组加入针对红外的高斯低通滤波。如果松弛机制有效，其在消除光晕的同时必须完整保留红外目标内部的高对比度边缘（高频细节不丢失），而低通滤波会导致整体边缘弥散。\n- **最近邻工作与查重**：\n  - 传统 TV (Total Variation) 正则：各向同性平滑，全图模糊，无模态自适应性；\n  - PCDFusion (NeurIPS 2026)：采用带通滤波 $B(Y_r)$ 约束红外残差，但未在空间边界显式建立接触滑移能量耗散方程；\n  - 结论：机制具备独立创新性。\n- **否定条件**：\n  若在细微树枝、密集栅栏等高频复杂重叠纹理区，应力松弛算子将真实的精细边缘误判为阶跃撕裂并予以过度抹平，导致空间频率 (SF) 或 AG 下降超过 15%，则假设被否定。\n- **下一步最小验证方案**：\n  构建一个 30 行 PyTorch 边界测试函数，输入 50 对 MSRS 边界裁块，比较 Baseline 与松弛损失输出的法向梯度截面轮廓。\n\n### [IDEA-002] 多孔介质毛细势垒跨模态定向渗流机制（Capillary Barrier Infiltration Control）\n- **当前假设**：\n  将多模态融合过程等价于多孔介质中两相流体的渗流过程：可见光背景构成具有非均质孔隙度的基底介质，红外热辐射作为试图穿透界面的非润湿流体相。在介质交界面上，表面张力形成“毛细进入压力势垒（Capillary Barrier, $P_c^\\star$）”。依据可见光局部曝光置信度与高频梯度构建阻尼势场：在可见光结构清晰区域，势垒高度趋于无穷，彻底阻绝热辐射扩散（杜绝惨白热斑膏药）；仅在可见光完全暗化或过曝失效的区域，毛细势垒自适应击穿，允许红外目标轮廓定向渗流注入。\n- **成立条件**：\n  1. 可见光图像能够通过局部照度与拉普拉斯能量准确区分“结构完好区”与“信息塌陷区”；\n  2. 红外图像在对应塌陷区能够提供高于噪声基底的目标连续轮廓。\n- **可区分预测**：\n  在车灯直射和完全背光的极端场景下，相比 NatureFusion 与传统方法，毛细势垒渗流不仅在可见光正常区实现 100% 自然色彩与纹理保真（零热斑污染），而且在 16 像素非对齐测试中，错位区域的伪影轮廓响应衰减 40% 以上。\n- **替代解释与区分对照**：\n  - *替代解释*：势垒可能仅仅退化为简单的局部照度门控（Masking）。\n  - *区分对照*：对比组采用硬阈值照度门控。如果毛细渗流机制有效，其在势垒击穿过渡带上应呈现符合达西渗流定律的连续非线性压力梯度，边缘无硬截断阶跃伪影；而硬门控会导致拼接缝与色阶断层。\n- **最近邻工作与查重**：\n  - NatureFusion (arXiv 2026)：通过 DiT 隐层差分向量 $\\Delta_{ir}$ 实现互补放大，无空间物理渗流解释，计算量极大；\n  - 传统引导滤波（Guided Filter）：全图平滑滤波，无相变与势垒击穿机制；\n  - 查重结论：多孔介质毛细势垒与渗流相变方程在 IVIF 中未见先例，机理独立。\n- **否定条件**：\n  若在弥散性低对比度红外目标（如被浓雾遮蔽的远距离行人）处，毛细势垒由于可见光噪声扰动无法稳定击穿，导致目标漏检率 $R_{miss}$ 显著劣于传统加权融合，则假设需修正或否定。\n- **下一步最小验证方案**：\n  在 MSRS 包含 50 对极端夜间样本的测试集上，设计 20 行毛细阻尼势场张量运算，可视化势垒阻绝与渗流分布图。\n\n### [IDEA-003] 功能梯度材料 (FGM) 空间相容性机制用于消除实例级可控融合边界撕裂\n- **当前假设**：\n  将多模态融合的实例调制权重视为复合材料中两种不同组分的连续体积分数场 $V_f(x,y)$。红外显著特征等价于高刚度陶瓷相，可见光背景等价于高韧性金属相。依据材料力学中的功能梯度材料（FGM）界面过渡理论，在空间维度引入基于符号距离变换（SDF）的 Sigmoidal 连续过渡剖面，并施加圣维南位移相容性正则损失 $\\mathcal{L}_{\\text{comp}} = \\|\\nabla \\times \\nabla F_{\\text{fuse}}\\|_2^2$。该机制能够从数学上保证实例外沿一阶与二阶空间导数处处连续，彻底消除二值掩码带来的剪贴画拼缝与边界光晕。\n- **成立条件**：\n  1. 场景中可由检测器或分割模型（如 Grounded-SAM-2）提供目标初始掩码或边界框；\n  2. 目标外沿具有局部背景邻域支持，过渡带宽 $W$ 可根据局部图像对比度自适应调节（通常在 3~7 像素以内）。\n- **可区分预测**：\n  在实例大幅度增强（如高斯调制强度 $z = +2.0$）的极限工况下，引入 FGM 空间相容性机制后，实例外沿法向二阶导数极值方差下降 45% 以上，人眼主观评估无任何硬拼接断层，且全图 Qabf 相比标准掩码调制提升 0.03 以上。\n- **替代解释与区分对照**：\n  - *替代解释*：边缘平滑可能仅仅是因为高斯模糊或简单羽化（Feathering）滤除了高频。\n  - *区分对照*：对比组采用标准 5x5 高斯滤波羽化掩码。如果 FGM 相容性机制有效，其在消除边缘断层撕裂的同时，目标内部及真实边缘的高频几何结构完整度（空间频率 SF）应保持 95% 以上，而普通高斯羽化会导致轮廓弥散模糊。\n- **最近邻工作与查重**：\n  - ConFusion (ACM MM 2026)：仅在参数空间引入李普希茨范数，空间维度仍依赖二值掩码；\n  - 传统 Alpha 抠图融合：依赖手工精细 Trimap，计算缓慢且缺乏物理相容力学理论支持；\n  - 查重结论：FGM 空间相容性方程在 IVIF 可控融合中属机理首创。\n- **否定条件**：\n  若在细长微小目标（如远处只有 2~3 像素宽的电线或纤细树枝）处，FGM 过渡带导致目标内部有效对比度被过度均质化，导致目标显著度下降超过 20%，则假设需修正或限制最小尺度。\n- **下一步最小验证方案**：\n  在 MSRS 提取 30 个包含典型行人与车辆边界的局部图像块，用 30 行 PyTorch 脚本计算 SDF 梯度势场，对比二值掩码、高斯羽化与 FGM 相容调制的法向截面线。\n\n### [IDEA-005] 基尔霍夫各向异性辐射-反射解耦势场\n- **当前假设**：\n  基于基尔霍夫辐射能量守恒 $\\epsilon(\\theta) + \\rho(\\theta) = 1$，在表面法向与视线观测方向夹角 $\\theta \\to 90^\\circ$（掠射角）时，反射率剧烈增加而发射率急剧衰减。引入局部表面法向估计构造角度依赖解耦场 $W_{ij}^{aniso} = \\epsilon_0 \\cos^p(\\theta_{ij})$，能动态压制倾斜金属车漆与积水表面的虚假热鬼影。\n- **成立条件**：\n  1. 可通过预训练单目法向估计器（如 Marigold/DSINE）获取粗粒度表面法向 $\\mathbf{n}$；\n  2. 场景中金属与水面遵循平滑反射物理规律。\n- **可区分预测**：\n  在倾角 $>60^\\circ$ 的侧向车辆与积水倒影区域，虚假热反射残差抑制率达 50% 以上，同时保持物体真实高温轮廓清晰。\n- **替代解释与区分对照**：\n  - *替代解释*：可能只是全局降低了红外权重。\n  - *区分对照*：对比各向同性固定权重截断。本机制仅在掠射角区域自适应衰减反射，法向正对区域发射率维持 100%。\n- **最近邻工作与查重**：\n  SGPDFuse (ACM MM 2026) 仅使用各向同性 2D 语义标量；HADAR 仅在纯红外测温中探索。本项在双模态融合中引入基尔霍夫角度辐射场属机理首创。\n- **否定条件**：\n  若在法向估计严重误差或粗糙漫反射表面导致有效热目标被误削弱，则假设需修正。\n- **下一步最小验证方案**：\n  在 MSRS 包含金属车辆侧向反光的夜间样本上，测试方向依赖衰减因子对虚假热轮廓残差的消除效果。\n\n### [IDEA-006] 弥散界面相场偏好对齐机制（DIP-Align）\n- **当前假设**：\n  将多模态融合的局域偏好调控域与背景基准域类比为材料热力学中的互溶两相系统。抛弃二值空间掩码，引入满足金兹堡-朗道（Ginzburg-Landau）自由能泛函的连续弥散相场 $\\Phi_{diffuse} \\in [0, 1]$，并通过梯度能项惩罚过大界面曲率。该机制能够从物理与数值上杜绝实例级偏好微调在交界处的梯度阶跃奇异性，消除边缘拼缝伪影。\n- **成立条件**：\n  1. 用户或任务给出的初始区域可通过距离变换转化为光滑相场分布；\n  2. 偏好微调区域具有局域连续过渡特征。\n- **可区分预测**：\n  在大强度偏好微调下，相比硬掩码 IDPO，交界面法向二阶导数极值方差下降 40% 以上，人眼感知无任何硬拼接断层，且全局图像质量指标（MUSIQ / CNNIQA）保持最优。\n- **替代解释与区分对照**：\n  - *替代解释*：可能只是高斯模糊掩码。\n  - *区分对照*：对比组采用简单高斯羽化掩码。弥散相场机制在界面处具有严格热力学能量极小化约束，过渡区既平滑又紧凑，而高斯模糊会导致调控区域弥散扩大并降低目标清晰度。\n- **最近邻工作与查重**：\n  DPOFusion (CVPR 2026) 采用硬掩码 IDPO；PatchDPO/FocusDPO 仅在文生图中探索局部注意力。在 IVIF 中引入弥散相场偏好微调属机理首创。\n- **否定条件**：\n  若在极微小目标（$\u003c3$ 像素）处相场过渡区占比过大导致偏好特性被过度稀释，则假设需针对微小尺度补充尺度自适应修正。\n- **下一步最小验证方案**：\n  编写 25 行 PyTorch 脚本，在 MSRS 样本上对比二值掩码、高斯羽化与弥散相场的法向二阶导数剖面。\n\n### [IDEA-009] 内聚界面位移跃变机制（Cohesive Interface Displacement Jump, CIDJ）用于消除非配准 IVIF 中 3D 前景橡胶膜拉伸伪影\n- **当前假设**：\n  将非严格配准场景中的多模态变形场分解为“基准主平面连续弹性形变场”与“3D 前景界面内聚位移跃变场”。在语义深度边缘线 $\\Gamma$ 上，打破传统的空间连续性导数惩罚，代之以固体力学内聚力模型（CZM）的牵引力-分离软化势能 $\\mathcal{E}_{\\text{cohesive}}([\\![ \\mathbf{u} ]\\!])$，允许前景目标发生有限的刚体位移跳跃，从机理上终结大视差目标边缘的橡胶膜拉伸与光晕撕裂。\n- **成立条件**：\n  1. 场景中存在明确的主导背景平面（如路面、天空或建筑立面）；\n  2. 3D 前景目标（行人、车辆）具有清晰的语义轮廓或深度分界面，且前景内部保持相对刚性或连续变形。\n- **可区分预测**：\n  在近景大视差未配准测试集中，引入内聚位移跃变机制后，前景目标边界处的法向梯度过渡带宽度缩窄 35% 以上，局部重影伪影指标 $N_{abf}$ 降低 25% 以上，且背景主平面的几何平滑度不受破坏。\n- **替代解释与区分对照**：\n  - *替代解释 A*：伪影消除可能仅仅来自于前景分割掩码的简单硬贴入（Cut-and-Paste）。\n  - *区分对照*：对比组加入前景硬掩码直接裁剪拼接。内聚跃变机制在允许位移跳变的同时，仍通过内聚牵引力势能维持界面处的特征能量连续性，不会产生硬剪贴画断层；而硬贴入会在交界处产生阶跃撕裂。\n- **最近邻工作与查重**：\n  - 传统 TV- $L_2$ 光流平滑：全局强制连续，导致大视差边缘橡胶薄膜拉伸；\n  - URMIF (IEEE TPAMI 2026)：采用分层变形估计与主平面先验，但局部变形场仍沿用连续平滑假设；\n  - 结论：尚无将 CZM 位移跃变势能应用于 IVIF 视差解耦的先例，属力学机制创新。\n- **否定条件**：\n  若在无深度起伏的平坦墙面或远景开阔地带，内聚跃变算子发生误判触发，导致图像局部产生非物理的裂纹或位移断层，且 mTRE 误差恶化超过 10%，则假设被否定。\n- **下一步最小验证方案**：\n  编写 20 行 PyTorch 单元测试脚本，在 RIVIR 典型行人未配准样本上对比经典连续平滑光流与内聚跃变变形场的法向梯度过渡截面。\n\n---\n\n## 周度跨论文综合（2026-11-06 首期综合）\n\n- **综合范围**：首期冷启动切片覆盖之近期前沿工作（PCDFusion, NatureFusion, RealFusion, DDFusion）。\n- **共同问题**：\n  各主流研究群体正一致放弃“将红外与可见光视为对称特征并直接做通道/注意力拼接”的旧范式，全面转向**物理非对称性与局部可靠性冲突的显式建模**。\n- **不同解释与证据分歧**：\n  1. *PCDFusion (NeurIPS 2026)* 认为矛盾的核心在于“局部动作决策的缺乏”，主张以可见光为核心锚点，通过贝叶斯后验机制分 Proposal、Context、Detail 三阶段注入红外信息；\n  2. *NatureFusion (Wuhan Univ, 2026-11)* 认为现有矛盾源于无监督训练下对源图像保真度的盲目追求，直接把热辐射当作亮斑贴在可见光上破坏了自然分布，主张利用生成式 Foundation Model 作为 Teacher 重新定义为“自然补全增强”；\n  3. *RealFusion (IEEE TIP, 2026)* 则从模态不变性空间出发，试图通过解耦光照变化来寻找模态共性。\n- **本周推进建议**：\n  建议将探索重心聚焦于 **PCDFusion 的三阶段物理先验锚定逻辑** 与 **IDEA-001 界面接触松弛机制** 的结合。前者提供了清晰的贝叶斯局部证据校准，后者可在物理层面彻底解决前者在 Detail 阶段单纯依赖带通滤波可能残留的微小边界应力撕裂。\n- **下一步最能区分解释的行动**：\n  在具有严重曝光饱和失效与树枝遮挡的夜间街景场景下，提取 PCDFusion 与 NatureFusion 的融合特征层，观察其在饱和区边界的激活热图是否有非物理外溢。\n\n---\n\n\n## 周度跨论文综合（2026-11-09 第二期综合：向非欧几何与物理可控融合深度收敛）\n\n- **综合范围**：近 180 天完成精读之四大前沿代表性工作（PCDFusion, NatureFusion, ConFusion, TEDFusion）。\n- **共同问题与范式跃迁**：\n  经过近一周对顶级会议与前沿预印本的纵深研读，可以清晰看到 IVIF 领域正经历深刻的三大范式跃迁：\n  1. **从“对称拼接”走向“物理非对称引导”**：早期将两模态均等对待的注意力/CNN 结构已彻底退潮，以 PCDFusion（贝叶斯先验）和 NatureFusion（可见光基底+红外互补增量）为代表，确立了非对称性融合的公理地位。\n  2. **从“无约束黑盒”走向“连续流形与可控调制”**：ConFusion（ACM MM 2026）打破了传统分类离散 Prompt 的桎梏，利用高斯空间调制变量证明了融合空间连续化的可行性与优越性。\n  3. **从“平直欧氏空间”走向“非欧曲率流形表征”**：今日精读的 TEDFusion（arXiv 2026）从根本上揭示了欧氏空间的度量饱和与特征扁平化缺陷，首次用双曲几何（Poincaré 球）证明了负曲率空间对多尺度树状层级语义的天然容纳优势。\n- **机制分歧与未决矛盾**：\n  - *分歧一（生成式 vs. 几何判别式）*：NatureFusion 依赖 9B DiT 大模型蒸馏以消除热斑，但计算成本极高且存在开集幻觉隐患；而 TEDFusion 表明，仅需在轻量 ViT 骨干上引入双曲流形与属性门控，即可在推理期免文本（Text-Free）实现同等优异的场景自适应性。\n  - *分歧二（参数空间连续 vs. 空间几何相容）*：ConFusion 在参数空间实现了李普希茨平滑，但二值掩码在物理空间导致剪贴痕；TEDFusion 在特征流形实现了非欧连续，但在空间像素域仍缺乏严格的界面力学连续性约束。\n- **本周集中深化建议（1~2 个核心候选）**：\n  1. **重点推进 [IDEA-003] 与 [IDEA-004] 的几何力学交叉融合**：将 ConFusion 的实例连续调制与 TEDFusion 的双曲/伪黎曼度规结合，构建一个“在特征空间具有双曲树状容积、在空间坐标具有功能梯度相容性”的统一非欧融合体系。\n  2. **暂缓高开销的生成式大模型路线**：不盲目追随 9B 参数的 DiT/Flow Matching 重型方案，坚守“单卡可验证、物理几何强可解释性”的科研主线。\n- **下一步最能区分机理的行动**：\n  在具有明显多尺度物体（远景建筑、中景车辆、近景行人）的街景样本上，分别绘制欧氏特征与双曲特征的 t-SNE / UMAP 投影图与协方差谱，实证证明非欧流形对层级语义聚类的优越性。\n\n---\n\n## 论文论证卡\n\n### [CARD-IDEA-001] 基于接触力学界面松弛的无伪影红外-可见光图像融合\n- **具体问题与价值**：\n  IVIF 长期受困于强红外目标边缘的“光晕撕裂”伪影。现有损失函数强制拉大梯度导致边缘局部应力集中与非自然亮环，直接损害人眼自然感与下游分割检测精度。\n- **现有方法不足**：\n  TarDAL、CDDFuse、SwinFusion 等均采用显式或隐式梯度最大化，无法区分目标真实几何轮廓与跨模态幅值失配导致的假边缘；PCDFusion 仅用带通滤波做启发式截断。\n- **核心假设与候选贡献**：\n  提出 Interfacial Stress Relaxation Loss（界面应力松弛损失），将跨模态边界融合建立在弹性接触力学界面能量滑移耗散理论之上，首次实现非对称模态交界的自适应应力卸载。\n- **主张与证据对照**：\n  - *主张 1*：消除红外目标边界伪光晕 $\\rightarrow$ 待补消融实验曲率对比图；\n  - *主张 2*：保留弱光背景下的暗部纹理 $\\rightarrow$ 待补 MSRS/DarkFace 语义分割实验。\n- **所需实验与图表骨架**：\n  - 图 1：物理直觉示意图（接触力学刚柔接触面应力集中 vs. 界面松弛流平滑演化）；\n  - 图 2：多方法边缘截面灰度剖面线对比图（Profile Curves across Target Boundaries）；\n  - 表 1：MSRS / FMB / M3FD 三大基准定量指标对比（重点关注 VIF, Qabf, Qcb 及边界伪影率 BAR）。\n- **写作素材与下一步**：\n  引言可直接对比 PCDFusion 的图 1(b) 失败案例与真实物理接触形变过程，形成直观、说服力强的问题切入点。\n\n\n### [CARD-IDEA-002] 基于多孔介质毛细势垒渗流力学的抗失真红外-可见光融合\n- **具体问题与价值**：\n  解决传统源保真度造成的“热辐射膏药”遮蔽可见光纹理色彩，以及几何错位时形成双体重影伪影的问题。\n- **现有方法不足**：\n  传统方法盲目叠加源模态；NatureFusion 采用 9B 大模型做隐层 CFG 差分外推，虽然抗错位能力强，但参数量巨大且无法避免大模型开集幻觉。\n- **核心假设与候选贡献**：\n  构建毛细进入压力势垒场 $\\Phi_{barrier}$，将可见光完好区视为不透水多孔介质，仅在可见光失效区实现物理级毛细击穿与定向渗流，轻量化实现极高抗错位鲁棒性与零热斑污染。\n- **主张与证据对照**：\n  - *主张 1*：8~32 像素非对齐下维持检测精度 $\\rightarrow$ 待补非对齐基准定量测试；\n  - *主张 2*：消除可见光背景上的热斑遮蔽 $\\rightarrow$ 待补与 NatureFusion / SwinFusion 定性视觉对比。\n- **所需实验与图表骨架**：\n  - 图 1：毛细势垒击穿与渗流流线示意图（Capillary Breakthrough and Seepage Field）；\n  - 图 2：非对齐错位下的特征响应衰减曲线图；\n  - 表 1：LLVIP / MSRS 非对齐测试集上的检测 AP 与感知质量指标。\n- **写作素材与下一步**：\n  结合 NatureFusion Table XI 的错位雪崩实验作为痛点引言，以物理多相渗流理论作为差异化论证支点。\n\n### [CARD-IDEA-003] 基于功能梯度材料空间相容性的无剪贴痕实例级可控图像融合\n- **具体问题与价值**：\n  解决以 ConFusion 为代表的新一代可控图像融合在实例级调节时，由于空间二值掩码带来的几何断层、剪贴画伪影及高阶空间导数奇异问题。\n- **现有方法不足**：\n  ConFusion 仅在控制参数空间建立李普希茨连续性，空间维度仍直接采用硬掩码做仿射调制；传统羽化或双边滤波缺乏力学相容性指导，极易造成局部边缘失真。\n- **核心假设与候选贡献**：\n  引入材料力学中的功能梯度材料（FGM）界面空间相容性势场，以符号距离场（SDF）为连续体积分数基底，施加连续介质位移相容性约束 $\\nabla \\times \\nabla F = 0$，首次实现实例可控融合在空间维度的严谨连续性保证。\n- **主张与证据对照**：\n  - *主张 1*：消除二值掩码外沿剪贴画断层 $\\rightarrow$ 待补边界法向截面导数方差对比曲线；\n  - *主张 2*：保持实例内部原生对比度与纹理 $\\rightarrow$ 待补局部 SF/AG 指标对比；\n  - *主张 3*：提升下游可控实例检测/分割精度 $\\rightarrow$ 待补 LLVIP/MSRS 细粒度任务实验。\n- **所需实验与图表骨架**：\n  - 图 1：力学直觉示意图（FGM 梯度界面应力卸载 vs. 传统突变界面应力集中）；\n  - 图 2：多控制强度（$z \\in [-1.5, +1.5]$）下边界空间导数热力图与剖面变化图；\n  - 表 1：MSRS / LLVIP 数据集上定量质量指标（EN, VIF, Qabf, 边界连续性指标 BCI）。\n- **写作素材与下一步**：\n  直接引用 ConFusion 图 7(c) 的边界伪影作为痛点引出，将固体力学 FGM 界面理论作为核心数学支点，构建具有鲜明学科交叉特色的方法论。\n\n\n### [CARD-IDEA-004] 基于洛伦兹伪黎曼时空光锥的因果解耦红外-可见光图像融合\n- **具体问题与价值**：\n  解决现有模态解耦网络基于欧氏平直空间正交假设导致的语义撕裂、信息扁平化以及环境退化下的非物理假边缘渗漏。\n- **现有方法不足**：\n  CDDFuse、DDFusion 强推欧氏正交约束 $\\langle F_{com}, F_{spec}\\rangle = 0$，将非线性纠缠的模态强行切碎；TEDFusion 虽引入黎曼双曲空间但未显式划分时空因果可信面。\n- **核心假设与候选贡献**：\n  提出 Lorentzian Spacetime Causal Decoupling（洛伦兹时空因果解耦机制），以非欧伪黎曼度规为几何底座，通过光锥不变量 $s^2$ 严格划分因果可信区与退化屏蔽区，实现首个具有物理相对论因果保障的 IVIF 解耦架构。\n- **主张与证据对照**：\n  - *主张 1*：消除模态强制正交引起的色斑与边界撕裂 $\\rightarrow$ 待补互信息与特征正交残差对比；\n  - *主张 2*：退化噪声下（浓雾、过曝）因果光锥绝热屏蔽 $\\rightarrow$ 待补合成恶劣天气鲁棒性实验。\n- **所需实验与图表骨架**：\n  - 图 1：洛伦兹光锥因果几何示意图（类时间热辐射、类空间可见光与因果可信面划分）；\n  - 图 2：特征协方差特征值衰减曲线对比（Euclidean vs. Lorentzian vs. Poincaré）；\n  - 表 1：MSRS / LLVIP / RoadScene 上鲁棒融合定量指标对比（重点关注 EN, SF, AG, VIF 及互信息解耦率 MIDR）。\n- **写作素材与下一步**：\n  可直接引述 TEDFusion 的表 4 特征值衰减崩溃现象作为动机，将物理时空因果律作为理论突围核心，形成极具审稿说服力的前言故事。\n\n### [CARD-IDEA-005] 基于基尔霍夫各向异性辐射-反射解耦势场的保真红外-可见光融合\n- **具体问题与价值**：\n  解决金属车漆、光滑地面积水在倾斜视角下对环境热辐射强烈镜面反射导致的“热鬼影”假象与结构撕裂。\n- **现有方法不足**：\n  SGPDFuse 虽提出语义物理参数桥，但采用各向同性 2D 标量假设，在掠射角菲涅尔效应下依然残留环境反射伪影。\n- **核心假设与候选贡献**：\n  将基尔霍夫角度辐射能量守恒引入多模态融合特征解耦，以空间表面法向连续调节反射衰减指数，实现角度感知的物理级退化剥离。\n- **主张与证据对照**：\n  - *主张 1*：消除倾斜视角车身热倒影 $\\rightarrow$ 待补法向倾角消融实验；\n  - *主张 2*：保持正对视角热目标高保真 $\\rightarrow$ 待补目标检测 mAP 评测。\n- **所需实验与图表骨架**：\n  - 图 1：基尔霍夫辐射-反射角度依赖物理原理图（发射率与反射率随观测倾角变化曲线）；\n  - 图 2：侧向车辆热倒影消除定性对比图；\n  - 表 1：MSRS 极端反光测试集定量对比表。\n- **写作素材与下一步**：\n  引言直接引用 SGPDFuse 的不可约简性反证，在此基础上指出各向同性假设的物理边界，顺理成章提出各向异性基尔霍夫解耦场。\n\n### [CARD-IDEA-006] 基于材料热力学弥散相场理论的无拼缝实例级偏好对齐红外-可见光融合\n- **具体问题与价值**：\n  解决基于 DPO 的实例级多模态图像偏好微调在二值掩码交界处的界面导数发散、边缘阶跃断层与拼缝光晕伪影。\n- **现有方法不足**：\n  DPOFusion 采用硬掩码分离偏好区与基准区，非偏好区强制一致性拉回导致交界面法向导数剧烈阶跃；常规高斯羽化缺乏能量守恒约束，易导致调控区域过度弥散与清晰度衰减。\n- **核心假设与候选贡献**：\n  提出 Diffuse Interface Phase-Field Preference Alignment（DIP-Align），将热力学 Cahn-Hilliard 相场方程引入空间偏好加权，施加金兹堡-朗道梯度能惩罚，首次实现偏好对齐在空间界面的物理级光滑演化。\n- **主张与证据对照**：\n  - *主张 1*：消除局域偏好微调外沿拼缝色阶断层 $\\rightarrow$ 待补交界面截面二阶导数对比；\n  - *主张 2*：保持目标核心区极致偏好响应 $\\rightarrow$ 待补局部指标对比；\n  - *主张 3*：背景全局结构 100% 稳定保真 $\\rightarrow$ 待补全图感知质量对比。\n- **所需实验与图表骨架**：\n  - 图 1：相场物理直觉图（硬掩码阶跃奇异性 vs. 弥散相场连续过渡能量曲线）；\n  - 图 2：多方法交界面法向截面导数 Profile 图；\n  - 表 1：MSRS / LLVIP 局域微调下的感知质量与边界连续性指标表。\n- **写作素材与下一步**：\n  引言直接以 DPOFusion 图 7 的红绿框局域微调为动机切入，指出二值划分在连续介质层面的理论断点，提出相场弥散界面解决方案。\n\n### [CARD-IDEA-007] 基于辐射通量平衡与各向异性双向反射拓扑流的真实 TeX 分解融合\n- **具体问题与价值**：\n  解决以 TeX-Gen 为代表的无物理真值分解在复杂外场强反光（金属、积水路面）与冷天空极端温差下，因固定环境温度凸组合导致的辐射基底坍缩与虚假热伪影。\n- **现有方法不足**：\n  TeX-Gen 将环境反射辐射硬编码为 293.15K 与 298.15K 的二值窄带标量组合，无法适应真实夜间大动态非等温环境；HADAR 依赖昂贵的高光谱红外硬件。\n- **核心假设与候选贡献**：\n  引入地表-冷天空双源辐射拓扑平衡方程与各向异性 BRDF 拓扑流（RFB-Flow），约束局部辐射热通量能量守恒，实现单波段双光图像下高保真、零虚假热斑的物理 TeX 生成与鲁棒融合。\n- **主张与证据对照**：\n  - *主张 1*：消除金属斜向反光导致的虚假高温斑块 $\nightarrow$ 待补反光区域残差定量对比；\n  - *主张 2*：冷天空视角下发射率估计不漂移 $\nightarrow$ 待补仿真真实发射率对比测试。\n- **所需实验与图表骨架**：\n  - 图 1：地表-冷天空双源双向反射拓扑流通量平衡示意图；\n  - 图 2：积水与金属车身虚假热目标消除对比图；\n  - 表 1：MSRS 极端反光测试集上的 TeX 分解误差与融合质量指标。\n- **写作素材与下一步**：\n  以 TeX-Gen 式 14-16 的窄带环境温度假设为逻辑切入，引入普朗克定律与辐射通量平衡连续性，构建完整的无监督辐射物理分解理论体系。\n\n### [CARD-IDEA-008] 基于液晶指向矢弹性力学与自发对称性破缺的多模态频域解耦融合\n- **具体问题与价值**：\n  解决多模态图像融合中全局刚体旋转鲁棒性与微观局部模态特异性细节之间的几何对称性冲突。\n- **现有方法不足**：\n  全谱等变方法（EMMA）造成高频过正则化与细节模糊；简单频域切分方法（RoES）高频完全缺乏几何连续性保证且受限于离散四向群；传统数据增广无法提供确定性群等变数学保障。\n- **核心假设与候选贡献**：\n  提出 Liquid Crystal Director Field Spontaneous Symmetry Breaking（LC-SSB）机制，将特征建模为连续液晶指向矢场。低频分量服从 Frank-Oseen 宏观连续介质弹性自由能守恒（全局群等变），高频局部引入可微相变序参量门控 $\\eta$，在强模态差异边缘自发触发相变破缺，首次在数学物理层面自洽统一了宏观旋转对称与微观各向异性细节。\n- **主张与证据对照**：\n  - *主张 1*：任意连续旋转下保持全局轮廓不畸变 $\nightarrow$ 待补连续角度扰动一致性指标；\n  - *主张 2*：消除全谱等变引起的微观纹理与热斑模糊 $\nightarrow$ 待补高频边缘 SF/AG 保持率；\n  - *主张 3*：下游小目标与非正交目标检测大幅提升 $\nightarrow$ 待补 M3FD/LLVIP 旋转扰动 mAP。\n- **所需实验与图表骨架**：\n  - 图 1：向列相液晶分子宏观指向矢排列与微观缺陷核自发相变破缺力学示意图；\n  - 图 2：连续旋转扰动（$0^\\circ \\sim 90^\\circ$）下高频特征协方差与序参量响应曲线；\n  - 表 1：MSRS / RoadScene / TNO 上综合质量指标（VIF, Qabf, Nabf, TOPSIS）及连续旋转等变误差对比。\n- **写作素材与下一步**：\n  直接引用 RoES 图 1 与图 3 的频域阈值实验作为理论断点切入，将凝聚态物理相变与 Frank 弹性力学作为核心数学推导工具，撰写极具跨学科深度的方法论章节。\n\n### [CARD-IDEA-009] 基于断裂力学内聚力模型（CZM）界面位移跃变的非严格配准大视差图像融合\n- **具体问题与价值**：\n  解决真实外场（车载夜视、无人机侦巡）非严格配准 IVIF 任务中，由于双传感器物理基线与复杂 3D 深度起伏引起的大视差矛盾，尤其是连续平滑先验在 3D 前景目标轮廓周围导致的橡胶薄膜拉伸、重影与背景撕裂伪影。\n- **现有方法不足**：\n  传统串联方法配准误差单向崩溃；特征层隐式对齐缺乏几何可解释性；URMIF 提出主平面先验与双向耦合，但局部形变场仍强制施加全局连续平滑正则化，在垂直突起于路面的近景行人处无法兼顾连续地表与离散视差跃变。\n- **核心假设与候选贡献**：\n  提出 Cohesive Interface Displacement Jump（CIDJ）机制，将断裂与界面力学中的内聚力模型引入空间变形估计。形变场分解为连续弹性分量与界面位移跃变分量 $\\mathbf{u}(\\mathbf{x}) = \\mathbf{u}_{\\text{smooth}}(\\mathbf{x}) + H(\\mathbf{x} \\in \\Omega_{\\text{fg}}) \\cdot [\\![ \\mathbf{u} ]\\!]$，在语义轮廓处以可微分内聚势能 $\\mathcal{E}_{\\text{cohesive}}$ 替代 $L_2$ 梯度惩罚，首次在力学与几何自洽层面统一了背景连续单应性与前景离散视差。\n- **主张与证据对照**：\n  - *主张 1*：消除 3D 前景边缘橡胶薄膜拉扯与虚假光晕 $\\rightarrow$ 待补 RIVIR 目标边界法向剖面过渡宽度对比；\n  - *主张 2*：保持主平面背景平滑无畸变 $\\rightarrow$ 待补主平面区域单应性重投影残差；\n  - *主张 3*：下游目标检测（YOLO/RT-DETR）在未对齐下的召回率提升 $\\rightarrow$ 待补大视差样本检测 mAP 对比。\n- **所需实验与图表骨架**：\n  - 图 1：力学内聚区界面脱粘滑移 vs. 大视差前景几何位移跃变直觉映射图；\n  - 图 2：连续平滑形变场与内聚跃变形变场在行人边缘的位移场梯度剖面曲线；\n  - 表 1：RIVIR / RoadScene 真实未配准数据集上配准误差（mTRE）、感知指标（VIF, Qabf, Nabf）及检测 mAP 综合对比表。\n- **写作素材与下一步**：\n  引言以 URMIF 的主平面先验为铺垫，指出其在多深度 3D 突起目标边缘的连续性假设断点，引入材料力学 CZM 理论，构建极具物理与力学美感的方法论叙事。\n"}</script>
