## 三、针对当前在研成果的投稿建议路线图

&gt; **合规红线声明**：在审稿件严禁出现在任何投稿路线中；路线中仅使用官方公布日期与时区，标明匿名评审政策（Double-Blind）与预印本发布规范（arXiv Policy）。

- **阶段一（短期冲刺，0~45天）**：
  - **目标 Venue**：CVPR 2027 (Main Track)
  - **截稿节点**：摘要 11-11，全文 11-18（北京时间）。
  - **适用成果特征**：已有完整定稿代码、消融实验矩阵闭环且具高度前沿视觉冲击力的成果。
  - **政策要求**：严格双盲（Dual Blind）；允许在审期间提交 arXiv，但严禁在社交媒体/社区公开宣传拉票破坏盲审。
- **阶段二（中期蓄力，45~90天）**：
  - **目标 Venue**：Information Fusion 特刊 (2027-01-01) 或 ICIP 2027 (2027-01-29)
  - **截稿节点**：2027 年 1 月。
  - **适用成果特征**：针对物理启发（如多孔介质渗流力学、接触界面应力松弛流）的理论型与机理型深耕成果。
  - **政策要求**：单盲/常规审稿；支持完整数学推导与附录大图。
- **阶段三（长线大作，90~180天）**：
  - **目标 Venue**：ICCV 2027 (2027-03-10) 或 IEEE TIP 特刊 (2027-03-16) / ACM MM 2027 (2027-04-12)
  - **截稿节点**：2027 年 3~4 月。
  - **适用成果特征**：构建非欧双曲几何、洛伦兹时空光锥因果解耦的大型理论与大模型结合工作。
  - **政策要求**：严格双盲，提前完成全部大规模基准对标与下游感知联合验证。
