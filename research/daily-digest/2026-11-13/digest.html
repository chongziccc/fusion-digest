<main id="app"></main><noscript><pre># 旋转等变性何时应该被打破？多模态融合中频域选择性几何先验与细节保留的权衡边界

在自动驾驶车载夜间感知场景中，车辆颠簸、急转弯或相机安装俯仰角常导致采集图像发生不同角度的旋转。传统多模态融合为了使感知对这种刚体位姿扰动鲁棒，往往尝试给全网络强加旋转等变性约束（Rotation Equivariance）——即输入旋转多少度，融合特征就对等旋转多少度。然而在实际视觉呈现中，这往往带来严重副作用：原本清晰的可见光车牌字符和百叶窗横纹在强旋转约束下被强行平滑抹去，而红外图像中的微小热斑也变得模糊散焦。为什么追求几何对称性反而损害了细粒度视觉质量？这正是今天最值得深入思考的核心科学矛盾。

## 今日论文

**论文题目**：*RoES: Rotational Equivariant Selective-frequency Fusion for Multimodal Images*  
**收录发表**：ACM International Conference on Multimedia 2026 (ACM MM &#x27;26 Main Track, CCF-A)  
**发表状态**：Accepted（官方会议论文集已收录，ISBN 979-8-4007-2213-4/2026/11，开源代码已公开）

直觉上，**一张图像的大尺度轮廓和微观细节并不遵守相同的对称定律**。建筑物的空间几何框架（低频结构）是各向同性的宏观刚体，旋转时必须严格对称等变；但红外微小孤立热源和可见光高频各向异性纹理（高频细节）则充满高度依赖传感器局部特性的非对称信息，盲目对高频施加等变约束只会带来过正则化破坏。

RoES 通过三个关键步骤优雅地化解了这一冲突：
1. **可学习提升小波解耦（RoUP）**：抛弃固定小波切分，采用非对称的预测器（CNN）与更新器（傅里叶等变卷积 F-Conv），在特征空间以完全可逆的方式动态剥离模态共享的低频结构与特异性高频细节。
2. **低频旋转等变 Mamba 建模（EM）**：对低频分量施加四向离散群 $C_4$ 旋转投影与状态空间扫描，以线性计算复杂度捕获大尺度长程几何拓扑一致性。
3. **极坐标频域注意力高频精炼（PSA）**：利用傅里叶谱在极坐标下将旋转退化为角向平移的数学性质，以低频稳定结构跨频引导高频振幅谱重构，同时保持原生相位空间定位不变。

[进入完整精读](papers/RoES_2609.12497.md)

## 值得继续追问

真实事实是：在受控频域滤波实验中，等变约束的最优收益区间严格落在低频阈值 $\tau \approx 0.35$ 附近，高频强行等变确会导致保真度指标断崖式下跌。作者的主张是据此实施低频等变、高频无约束解耦。但我们的猜想是：**高频细节完全没有对称性规律吗？还是它服从局部的“自发对称性破缺”物理相变规律？**

如果高频并非完全无约束，而是像液晶相场一样在局部缺陷处发生破缺、在背景处继承拓扑连续，我们能否以相场弹性力学构建更具自洽性的自发对称破缺机制？我们形成了候选假说 [IDEA-008](research_threads.md#card-idea-008)，结合液晶指向矢自由能，在保留宏观拓扑的同时赋予微观缺陷相变自由度。

## 工具与技术

- **[TOOL-009] Escnn (e2cnn 升级版) — 严格群等变深度学习与旋转平移对称性计算库**
  - **解决痛点**：在 PyTorch 中构建旋转等变网络时，传统插值或手工旋转采样易产生高频混叠与显存激增。
  - **核心价值**：通过调和基函数展开（Harmonic Steerable Filters）原生支持 $C_N$、$D_N$ 与 $SO(2)$ 群等变可微卷积，显存占用降低 30%，为几何等变融合提供工业级无损算子底座。
  - **适用前提**：本地 Python 3.10+ / PyTorch 2.0+，无需编译，纯张量库。
  - **下一步建议**：编写 10 行最小可验证测试脚本，验证其在双分支浅层特征上的等变误差与耗时。
  - 详细核验记录见 [tool_watch.md](tool_watch.md#tool-009-escnn-v1012--严格群等变深度学习与旋转平移对称性计算库) 与 [附录](appendix.md)。

## 今天的下一步

1. **机制反思**：深入研读 [RoES 完整精读](papers/RoES_2609.12497.md) 中的极坐标振幅跨频注意力数学推导，理解笛卡尔旋转到极坐标平移的映射技巧。
2. **假说推进**：在 [research_threads.md](research_threads.md#question-008) 维护 QUESTION-008 关于几何等变与局部破缺的边界证据，深化液晶相场破缺假说。
